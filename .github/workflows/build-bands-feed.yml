name: Rebuild BCRA bands shared feed
on:
  push:
    branches: [main]
    paths:
      - 'data/rem-history.js'
      - 'data/bands-history.js'
      - 'data/bands-model.js'
      - 'scripts/bands-feed-core.js'
      - 'scripts/build-bands-feed.js'
      - '.github/workflows/build-bands-feed.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bands-json-main
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source data and reconcile bands
        run: node tests/bands.check.js
      - name: Generate shared static JSON feed
        run: node scripts/build-bands-feed.js
      - name: Commit refreshed feed only when data changed
        run: |
          if git diff --quiet -- data/bandas-bcra.json; then
            echo "Shared feed is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bandas-bcra.json
          git commit -m "data: refresh official and projected BCRA bands feed"
          git push origin HEAD:main
